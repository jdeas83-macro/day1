<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Day 1"><title>Cardio · Day 1</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/logo.svg"></head><body><main class="app"><header><div class="brand"><img class="brand-icon" src="icons/logo.svg" alt=""> Day 1</div><h1>Cardio</h1><p class="muted">Small steps. Stronger every day.</p></header><section class="card"><h2>Today's cardio</h2><div class="stat-pair"><div><strong id="cardioCalories">0</strong><span>kcal burned</span></div><div><strong id="cardioMinutes">0</strong><span>minutes</span></div></div><p class="muted helper">Calories are recorded from your watch or machine. They do not increase your food calorie allowance.</p></section><form class="card" id="cardioForm"><h2 id="cardioFormTitle">Log an activity</h2><label for="cardioDate">Date</label><input id="cardioDate" type="date" required><label for="activity">Activity</label><select id="activity"><option>Walking</option><option>Running</option><option>Cycling</option><option>Rowing</option><option>Swimming</option><option>Elliptical</option><option>Other</option></select><div class="two-col"><div><label for="duration">Minutes</label><input id="duration" type="number" min="0.1" step="0.1" required inputmode="decimal"></div><div><label for="burned">Calories burned (kcal)</label><input id="burned" type="number" min="0" step="1" required inputmode="numeric"></div></div><label for="distance">Distance in km (optional)</label><input id="distance" type="number" min="0" step="0.01" inputmode="decimal"><label for="cardioNotes">Notes (optional)</label><textarea id="cardioNotes" maxlength="2000"></textarea><button class="primary" id="saveCardio" type="submit">Save cardio</button><button class="secondary" id="cancelCardio" type="button" hidden>Cancel edit</button><p id="cardioStatus" role="status"></p></form><section class="card"><h2>Activity history</h2><div id="cardioHistory"></div></section></main><nav aria-label="Main navigation">
<button id="dashboardButton"><div class="icon">⌂</div><div>Today</div></button>
<button id="libraryButton"><div class="icon">＋</div><div>Food</div></button>
<button id="workoutsButton"><div class="icon">🏋</div><div>Workouts</div></button>
<button id="cardioButton"><div class="icon">♡</div><div>Cardio</div></button>
<button id="historyButton"><div class="icon">↗</div><div>History</div></button>
<button id="settingsButton"><div class="icon">⚙</div><div>Settings</div></button>
</nav><script src="js/training-store.js"></script><script src="js/cardio.js"></script><script src="js/app.js"></script></body></html>
