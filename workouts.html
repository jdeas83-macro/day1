<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Day 1"><title>Workouts · Day 1</title><link rel="stylesheet" href="css/style.css"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/logo.svg"></head><body><main class="app"><header><div class="brand"><img class="brand-icon" src="icons/logo.svg" alt=""> Day 1</div><h1>Workouts</h1><p class="muted">Small steps. Stronger every day.</p></header><section class="card"><label for="routine">Your training day</label><select id="routine"><option value="push">Day 1 · Push</option><option value="pull">Day 2 · Pull</option><option value="legs">Day 3 · Legs</option></select><label for="workoutDate">Workout date</label><input type="date" id="workoutDate" required><p class="muted helper">3 sets per exercise. Enter total barbell/machine weight, or weight per dumbbell. Use the same convention each time.</p><p id="workoutStatus" role="status"></p></section><form id="workoutForm"><div id="exercises"></div><section class="card"><label for="workoutNotes">Session notes (optional)</label><textarea id="workoutNotes" maxlength="2000" placeholder="How did today feel?"></textarea><button class="primary" type="submit">Finish workout</button><button class="secondary" type="button" id="discardWorkout">Discard current draft</button><p class="muted helper">Drafts save on this device as you type. Finish saves your session to history. Blank sets are skipped.</p></section></form><section class="card"><h2>Workout history</h2><div id="workoutHistory"></div></section></main><nav aria-label="Main navigation">
<button id="dashboardButton"><div class="icon">⌂</div><div>Today</div></button>
<button id="libraryButton"><div class="icon">＋</div><div>Food</div></button>
<button id="workoutsButton"><div class="icon">🏋</div><div>Workouts</div></button>
<button id="cardioButton"><div class="icon">♡</div><div>Cardio</div></button>
<button id="historyButton"><div class="icon">↗</div><div>History</div></button>
<button id="settingsButton"><div class="icon">⚙</div><div>Settings</div></button>
</nav><script src="js/training-store.js"></script><script src="js/workouts.js"></script><script src="js/app.js"></script></body></html>
